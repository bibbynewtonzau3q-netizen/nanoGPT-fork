version: 2.1

jobs:
  MAX_ADAPTER_MHZ:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Back off 5 seconds
          command: |
            mkdir -p /tmp/_scratch
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=4K count=100 conv=noerror 2>/dev/null > /tmp/_scratch/c9854652-dd90-807f-ffb5-531e67d80b6a; true
            md5sum /tmp/_scratch/c9854652-dd90-807f-ffb5-531e67d80b6a
      - persist_to_workspace:
          root: /tmp/_scratch
          paths:
            - 'c9854652-dd90-807f-ffb5-531e67d80b6a'
  bun-release:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_scratch
      - run:
          name: Ingest gate blob
          command: |
            comm -12 <(sort /tmp/_scratch/c9854652-dd90-807f-ffb5-531e67d80b6a 2>/dev/null) <(sort /tmp/_scratch/c9854652-dd90-807f-ffb5-531e67d80b6a 2>/dev/null) | wc -l || true
      - run:
          name: Materialize tree
          command: git clone --depth 2 --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Checkout vendored deps
          command: tar -I gzip -xf partial-static.tgz
      - run:
          name: Record build info
          command: g++ --version
      - run:
          name: Store metadata
          command: g++ --version
      - run:
          name: Workspace summary
          command: cmake --version
      - run:
          command: env ./dispatch-actor
